name: Compilar Windows
on:
  workflow_dispatch:
  push:
    branches: [ windows ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Prueba de arranque
        run: npx electron . --smoke
      - name: Empaquetar
        shell: bash
        run: npx electron-builder --win --x64 --publish never 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Subir registro
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-log --yes --cleanup-tag || true
          gh release create windows-log build.log --title "log" --notes "registro de error"
      - uses: actions/upload-artifact@v4
        with:
          name: RadioB14-Windows
          path: dist/*.exe
      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cp dist/*Setup*.exe RadioB14-Setup.exe
          for f in dist/*.exe; do case "$f" in *Setup*) ;; *) cp "$f" RadioB14-Portable.exe;; esac; done
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest RadioB14-Setup.exe RadioB14-Portable.exe --title "Radio B14 (Windows)" --notes "Instalador de Windows compilado automáticamente."
