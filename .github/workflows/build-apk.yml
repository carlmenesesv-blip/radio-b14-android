name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Compilar
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RadioB14-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RadioB14.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest RadioB14.apk --title "Radio B14 (APK)" --notes "APK de depuración compilado automáticamente. Instálalo y elige Radio B14 como pantalla de inicio."
